# =============================================================================
# RecommendMe API — Docker Compose (local development only)
# =============================================================================
# Starts the FastAPI application alongside a Redis instance.
#
# Usage:
#   docker compose up --build          # Build and start all services
#   docker compose down                # Stop and remove containers
#   docker compose down -v             # Also remove the Redis data volume
#
# NOTE: This file is intended for local development only.
# Production deployment via Docker is managed by the CI/CD pipeline and is
# intentionally disabled until backend integration is complete.
# See .github/workflows/deploy.yml.
# =============================================================================

version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    ports:
      - "8000:8000"
    # Load environment variables from the repository root .env file.
    # CORS_ORIGINS must be a JSON array string, e.g. ["http://localhost:3000"]
    env_file:
      - ../.env
    # Wait for Redis to pass its health check before starting the API.
    depends_on:
      redis:
        condition: service_healthy
    # Mount source code as a volume for live-reload during development.
    volumes:
      - ../:/app
    # Use --reload for hot-reloading on source changes in development.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Persist Redis data across container restarts.
    volumes:
      - redis_data:/data

volumes:
  redis_data:
