# =============================================================================
# Continuous Integration — lint + test
# =============================================================================
# This workflow runs on every push to main/develop and on pull requests.
# It is intentionally kept separate from the deploy workflow so CI can run
# freely while deployment remains disabled during the development phase.
#
# Prerequisites before enabling the test suite:
#   - OPENAI_API_KEY and SERPAPI_API_KEY secrets must be added to GitHub.
#   - The Redis service is provided by the workflow itself (no external dep).
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    # Temporarily disabled while backend structure changes are being stabilized.
    # Re-enable by removing this line.
    if: false
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install production dependencies
        run: |
          pip install --upgrade pip
          pip install -r Requirements/requirements.txt

      - name: Install development dependencies
        run: pip install -r Requirements/requirements-dev.txt

      - name: Lint with ruff
        run: ruff check app/ tests/

      - name: Run tests
        env:
          OPENAI_API_KEY: test-key
          SERPAPI_KEY: test-key
          REDIS_URL: redis://localhost:6379
        run: pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

